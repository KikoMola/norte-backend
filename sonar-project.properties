# SonarQube Cloud (SonarCloud). Organización y clave a confirmar al dar de alta el proyecto.
sonar.organization=kikomola
sonar.projectKey=KikoMola_norte-backend
sonar.projectName=norte-backend

sonar.sources=app/src/main,bff/src/main
sonar.tests=app/src/test,bff/src/test
sonar.exclusions=**/build/generated/**

sonar.java.source=25
sonar.java.binaries=app/build/classes/java/main,bff/build/classes/java/main
sonar.java.test.binaries=app/build/classes/java/test,bff/build/classes/java/test
sonar.java.libraries=/home/runner/.gradle/caches/modules-2/files-2.1/**/*.jar

# Informes XML de JaCoCo generados por `./gradlew build`.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml,bff/build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=app/build/test-results/test,bff/build/test-results/test
