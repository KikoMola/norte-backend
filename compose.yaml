# Entorno local: `docker compose up -d`
#
#   PostgreSQL  localhost:5433  (norte_owner / norte_app)
#   Keycloak    http://localhost:8180  (admin / admin; realm "norte")
#   Grafana     http://localhost:3000  (OTLP en 4317 gRPC y 4318 HTTP)
#   Mailpit     http://localhost:8025  (SMTP en 1025)
name: norte

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: norte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d norte"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres-data:
