<!DOCTYPE html>
<!--/*
  Marco común de los correos (paso 1.8). Tablas y estilos en línea: es lo único que respetan todos los clientes de
  correo. Cada plantilla aporta su <title> (el asunto) y su contenido:

    <html th:replace="~{mail/layout.html :: layout(~{::title}, ~{::#content})}">
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" th:lang="${#locale.language}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title th:replace="${title}">Asunto</title>
</head>
<body style="margin: 0; padding: 0; background: #f3f3f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f3f3f0;">
<tr>
<td align="center" style="padding: 32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width: 600px; background: #ffffff; border: 1px solid #deded8; border-radius: 6px;">
<tr>
<td style="padding: 20px 32px; border-bottom: 1px solid #deded8; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; color: #1b1b19;"
    th:text="${senderName}">Acme Ibérica S.L.</td>
</tr>
<tr>
<td style="padding: 28px 32px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.6; color: #1b1b19;">
<div th:replace="${content}">Contenido</div>
</td>
</tr>
</table>
<p style="margin: 16px 0 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #5e5e59;"
   th:text="#{mail.footer(${senderName})}">Este correo lo envía Acme Ibérica S.L. con Norte.</p>
</td>
</tr>
</table>
</body>
</html>
