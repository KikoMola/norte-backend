spring:
  application:
    name: norte-app
  threads:
    virtual:
      enabled: true
  datasource:
    # La aplicación conecta con un usuario que no es dueño de las tablas y no tiene BYPASSRLS (paso 0.14).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/norte}
    username: ${DB_APP_USER:norte_app}
    password: ${DB_APP_PASSWORD:norte_app}
  flyway:
    # Flyway migra con el usuario dueño de los esquemas y las tablas.
    user: ${DB_OWNER_USER:norte_owner}
    password: ${DB_OWNER_PASSWORD:norte_owner}
  jpa:
    open-in-view: false
    properties:
      # Historial con Envers (paso 1.4). Al borrar se guardan también los datos, así la fila de auditoría conserva su
      # tenant_id (la política RLS lo exige) y el historial muestra qué se borró.
      org.hibernate.envers.store_data_at_delete: true
      org.hibernate.envers.audit_table_suffix: _aud
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/norte}
          audiences: norte-api

server:
  port: ${PORT:8081}

norte:
  keycloak:
    # API de administración de Keycloak; solo la usa el comando provision-tenant (paso 1.1).
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: norte
    client-id: norte-provisioner
    client-secret: ${KEYCLOAK_PROVISIONER_SECRET:norte-provisioner-dev-secret}
  files:
    # Almacén compatible con S3 (paso 1.7): SeaweedFS de compose.yaml en local.
    endpoint: ${FILES_ENDPOINT:http://localhost:8333}
    # Dirección pública para las URLs firmadas; en local, la misma.
    public-endpoint: ${FILES_PUBLIC_ENDPOINT:}
    bucket: ${FILES_BUCKET:norte}
    access-key: ${FILES_ACCESS_KEY:norte-app}
    secret-key: ${FILES_SECRET_KEY:norte-files-dev-secret}

logging:
  structured:
    # Logs JSON (ECS) con traceId, spanId y tenantId del MDC (paso 0.18). LOG_FORMAT admite ecs, logstash o gelf.
    format:
      console: ${LOG_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: norte
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
  logging:
    export:
      otlp:
        # Los logs van a la consola en JSON; su envío a Loki por OTLP necesita el appender de logback de
        # OpenTelemetry, que aún es alfa. Ver docs/configuracion.md.
        enabled: false
